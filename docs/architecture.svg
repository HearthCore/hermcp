<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="title desc">
<title id="title">hermcp architecture</title>
<desc id="desc">MCP clients (Claude.ai, Claude Desktop, Codex/Cursor, a phone, cron scripts) reach a TLS edge, which forwards to hermcp; hermcp authenticates and scopes every call, redacts results, audits them, and talks to Hermes over its api_server, CLI, gateway socket and files.</desc>
<rect width="900" height="430" fill="#070a08"/>
<defs><marker id="pdArw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#00b82f"/></marker></defs><text x="20" y="26" fill="#7e9384" font-family="monospace" font-size="12">MCP clients</text><rect x="20" y="36" width="150" height="46" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="95" y="55" fill="#d6e4d8" font-family="monospace" font-size="12" text-anchor="middle">Claude.ai</text><text x="95" y="71" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">OAuth 2.1 + PKCE</text><rect x="20" y="92" width="150" height="46" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="95" y="111" fill="#d6e4d8" font-family="monospace" font-size="12" text-anchor="middle">Claude Desktop</text><text x="95" y="127" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">Bearer key</text><rect x="20" y="148" width="150" height="46" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="95" y="167" fill="#d6e4d8" font-family="monospace" font-size="12" text-anchor="middle">Codex / Cursor</text><text x="95" y="183" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">Bearer key</text><rect x="20" y="204" width="150" height="46" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="95" y="223" fill="#d6e4d8" font-family="monospace" font-size="12" text-anchor="middle">Phone (voice)</text><text x="95" y="239" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">read-only key</text><rect x="20" y="260" width="150" height="46" rx="8" fill="#101711" stroke="rgba(0,255,65,.16)"/><text x="95" y="279" fill="#d6e4d8" font-family="monospace" font-size="12" text-anchor="middle">cron / scripts</text><text x="95" y="295" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">POST /inbox</text><text x="330" y="26" fill="#7e9384" font-family="monospace" font-size="12">edge</text><rect x="280" y="36" width="170" height="120" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="365" y="58" fill="#00FF41" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">reverse proxy</text><text x="365" y="76" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">TLS termination</text><text x="365" y="92" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">host allowlist</text><text x="365" y="112" fill="#ffb347" font-family="monospace" font-size="10" text-anchor="middle">/mcp</text><text x="365" y="128" fill="#ffb347" font-family="monospace" font-size="10" text-anchor="middle">/authorize /token</text><text x="365" y="144" fill="#ffb347" font-family="monospace" font-size="10" text-anchor="middle">/.well-known/*</text><rect x="280" y="204" width="170" height="102" rx="8" fill="#0c110d" stroke="rgba(0,255,65,.16)" stroke-dasharray="5 4"/><text x="365" y="226" fill="#7e9384" font-family="monospace" font-size="12" text-anchor="middle">host loopback</text><text x="365" y="246" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">127.0.0.1:9230</text><text x="365" y="264" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">/health · /inbox</text><line x1="170" y1="82" x2="280" y2="82" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="170" y1="150" x2="280" y2="120" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="170" y1="230" x2="280" y2="250" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><text x="560" y="26" fill="#7e9384" font-family="monospace" font-size="12">hermcp (own process, systemd)</text><rect x="500" y="36" width="220" height="270" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="610" y="60" fill="#00FF41" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">hermcp serve</text><text x="520" y="86" fill="#ffb347" font-family="monospace" font-size="10">auth</text><text x="700" y="86" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">bearer / OAuth 2.1</text><text x="520" y="104" fill="#ffb347" font-family="monospace" font-size="10">scopes</text><text x="700" y="104" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">access · sets · profiles</text><text x="520" y="122" fill="#ffb347" font-family="monospace" font-size="10">tools</text><text x="700" y="122" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">144 in 18 sets + meta</text><text x="520" y="140" fill="#ffb347" font-family="monospace" font-size="10">inbox</text><text x="700" y="140" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">ledger + watcher</text><text x="520" y="158" fill="#ffb347" font-family="monospace" font-size="10">approvals</text><text x="700" y="158" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">run + cross-session</text><text x="520" y="176" fill="#ffb347" font-family="monospace" font-size="10">audit</text><text x="700" y="176" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">JSONL, redacted</text><text x="520" y="194" fill="#ffb347" font-family="monospace" font-size="10">keys</text><text x="700" y="194" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="end">HMAC · 0600</text><rect x="516" y="206" width="188" height="40" rx="6" fill="#050705" stroke="rgba(0,255,65,.16)"/><text x="610" y="222" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">adapters: Hermes CLI</text><text x="610" y="238" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">api_server · files · socket</text><rect x="516" y="252" width="188" height="38" rx="6" fill="#050705" stroke="rgba(0,255,65,.16)"/><text x="610" y="268" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">redaction on every result</text><text x="610" y="283" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">dry_run on mutating</text><line x1="450" y1="96" x2="500" y2="96" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="365" y1="306" x2="365" y2="330" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><text x="770" y="26" fill="#7e9384" font-family="monospace" font-size="12">Hermes Agent</text><rect x="750" y="36" width="130" height="60" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="815" y="58" fill="#d6e4d8" font-family="monospace" font-size="11" text-anchor="middle">api_server</text><text x="815" y="74" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">per-profile keys</text><rect x="750" y="106" width="130" height="60" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="815" y="128" fill="#d6e4d8" font-family="monospace" font-size="11" text-anchor="middle">CLI</text><text x="815" y="144" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">subprocess</text><rect x="750" y="176" width="130" height="60" rx="8" fill="#101711" stroke="rgba(0,255,65,.32)"/><text x="815" y="198" fill="#d6e4d8" font-family="monospace" font-size="11" text-anchor="middle">gateway</text><text x="815" y="214" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">socket + hooks</text><rect x="750" y="246" width="130" height="60" rx="8" fill="#101711" stroke="rgba(0,255,65,.16)"/><text x="815" y="268" fill="#d6e4d8" font-family="monospace" font-size="11" text-anchor="middle">profiles · files</text><text x="815" y="284" fill="#7e9384" font-family="monospace" font-size="10" text-anchor="middle">state.db · .env</text><line x1="720" y1="120" x2="750" y2="70" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="720" y1="180" x2="750" y2="140" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="720" y1="230" x2="750" y2="200" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><line x1="610" y1="306" x2="720" y2="280" stroke="#00b82f" stroke-width="1.5" marker-end="url(#pdArw)"/><text x="20" y="350" fill="#7e9384" font-family="monospace" font-size="11">trust boundary:</text><line x1="170" y1="346" x2="330" y2="346" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="6 4"/><text x="340" y="350" fill="#ffb347" font-family="monospace" font-size="11">TLS at the proxy · loopback-only hermcp · single instance · audit of every call</text><text x="20" y="372" fill="#7e9384" font-family="monospace" font-size="11">voice path:</text><text x="112" y="372" fill="#d6e4d8" font-family="monospace" font-size="11">read-only key → inbox poll → watcher events → approval from the live run</text>
</svg>
